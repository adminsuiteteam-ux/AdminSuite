services:
  - type: web
    name: adminsuite-api
    runtime: python
    rootDir: admin-suite-backend
    buildCommand: ./build.sh
    startCommand: daphne core.asgi:application --bind 0.0.0.0 --port $PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # ── Database ─────────────────────────────────────────────────────────────
      # Set DATABASE_URL securely in Render Dashboard (e.g., Xata PostgreSQL)
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: adminsuite-api
          property: host
      - key: CORS_ALLOWED_ORIGINS
        value: https://adminsuite.onrender.com,https://adminsuite-web.onrender.com
      # ── Email (Gmail SMTP) ───────────────────────────────────────────────────
      # Configure your Gmail username and 16-character App Password.
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # ── Cloudinary (media storage) ───────────────────────────────────────────
      # Configure in Render Dashboard for avatar/logo uploads.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@adminsuite.app
      - key: ADMIN_PASSWORD
        sync: false
      - key: SETUP_SECRET_TOKEN
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: adminsuite
    runtime: static
    rootDir: admin-suite-landing
    buildCommand: npm run build
    staticPublishPath: dist

  - type: web
    name: adminsuite-web
    runtime: static
    rootDir: admin-suite-web
    buildCommand: npm run build
    staticPublishPath: dist

